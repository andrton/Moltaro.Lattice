name: CI

# Runs for every pull request and for every push to main, also when only documents
# changed: the "build" check is required before a merge, and a required check that does
# not run would block the pull request. See docs/work/branches.md.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: src

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: src/global.json
      - run: dotnet build --configuration Release
      - run: dotnet format --verify-no-changes
        # The formatter's workspace loads the generator built in the previous step.
        env:
          Configuration: Release
      - run: dotnet test --configuration Release --no-build
      # The samples run to the end, and Program.cs refuses to run when the README of the samples
      # lists them in another order.
      - run: dotnet run --project Moltaro.Lattice.Samples --configuration Release --no-build

  # The same default lane on Windows. Only "build" is a required check of main.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: src/global.json
      - run: dotnet build --configuration Release
      - run: dotnet test --configuration Release --no-build

  # The same default lane on Linux ARM64. Reads take no lock and a write is published by one
  # store, and the memory ordering of x64 hides a class of faults that ARM64 does not; this job
  # runs the suite where they show. Not a required check of main. A failure here that the other
  # jobs do not show is a finding about the engine first and about the test second.
  arm64:
    runs-on: ubuntu-24.04-arm
    # The lane of the ordering stress: x64 keeps stores in their order, so a defect of the order of
    # stores of the engine shows only on hardware that orders them weakly.
    env:
      LATTICE_ORDERING_STRESS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: src/global.json
      - run: dotnet build --configuration Release
      - run: dotnet test --configuration Release --no-build
