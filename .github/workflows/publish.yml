name: Publish

# Pushing a tag such as v0.1.0 or v0.2.0-alpha.1 builds, tests and publishes that version
# of the packages to the GitHub Packages feed of the repository owner. A release is cut
# from main only; see docs/work/branches.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

defaults:
  run:
    working-directory: src

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, to tell whether the tagged commit is on main.
          fetch-depth: 0
      - name: Refuse a tag that is not on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: src/global.json
      - name: Take the version from the tag
        run: echo "PACKAGE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - run: dotnet build --configuration Release -p:Version=$PACKAGE_VERSION
      - run: dotnet test --configuration Release --no-build
      - run: dotnet pack --configuration Release --no-build -p:Version=$PACKAGE_VERSION --output ../artifacts
      - name: Push to GitHub Packages
        run: >
          dotnet nuget push "../artifacts/*.nupkg"
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --api-key "${{ secrets.GITHUB_TOKEN }}"
